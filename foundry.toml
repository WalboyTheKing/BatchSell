[profile.default]
src = "contracts/src"
out = "contracts/out"
test = "contracts/test"
script = "contracts/script"
libs = ["contracts/lib", "node_modules"]
remappings = [
  "forge-std/=contracts/lib/forge-std/src/",
  "@openzeppelin/=node_modules/@openzeppelin/"
]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[rpc_endpoints]
bsc = "https://binance.llamarpc.com"
bsc_testnet = "https://data-seed-prebsc-1-s1.binance.org:8545"
